name: miss_you_ai
description: "Miss You AI - An AI-powered relationship app for couples."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  firebase_messaging: ^15.1.3

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # UI / animation
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  glassmorphism: ^3.0.0
  lottie: ^3.1.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Local storage / security
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0

  # Media
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  #record: ^5.1.2
  video_player: ^2.9.2

  # Utils
  intl: ^0.19.0
  uuid: ^4.5.1
  timeago: ^3.7.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  path_provider: ^2.1.5

  # Payments
  razorpay_flutter: ^1.3.7
  in_app_purchase: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true